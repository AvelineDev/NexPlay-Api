name: nexplay-api
services:
  - name: api
    type: web
    instance_type: free
    ports:
      - port: 8000
        protocol: http
    routes:
      - path: /
        port: 8000
    env:
      - key: PORT
        value: "8000"
    run_command: gunicorn main:app --workers 2 --bind 0.0.0.0:8000 --timeout 60
